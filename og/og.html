<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0e1117;font-family:'Pretendard Variable',sans-serif;color:#f0f3f6;overflow:hidden;position:relative}
.glow{position:absolute;right:-120px;top:-160px;width:760px;height:760px;background:radial-gradient(circle,rgba(88,166,255,.18),transparent 62%)}
.left{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:620px}
.me{display:flex;align-items:baseline;gap:16px;margin-bottom:30px}
.me img{width:72px;height:72px;border-radius:20px}
.me b{font-size:40px;font-weight:800;letter-spacing:.5px}
.me span{display:block;font-size:22px;color:#8b949e;font-weight:500;margin-top:2px}
h1{font-size:70px;line-height:1.22;font-weight:800;letter-spacing:-1.5px}
h1 em{font-style:normal;color:#58a6ff}
.sub{margin-top:26px;font-size:28px;color:#8b949e;font-weight:500}
.url{position:absolute;left:72px;bottom:46px;font-size:26px;color:#c9d1d9;font-weight:600;letter-spacing:.3px}
.grid{position:absolute;right:-90px;top:50%;transform:translateY(-50%) rotate(-12deg);display:grid;grid-template-columns:repeat(3,150px);gap:26px}
.grid img{width:150px;height:150px;border-radius:34px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.grid img:nth-child(3n+2){transform:translateY(-60px)}
</style></head><body>
<div class="glow"></div>
<div class="left">
 
 <h1>혼자 기획하고,<br>만들고, <em>운영합니다.</em></h1>
 
</div>
<div class="url">clpak.dev</div>
<div class="grid">
 <img src="../naru-icon.png"><img src="../muhanpalace-icon.png"><img src="../hoegwan-icon.png">
 <img src="../cannon-icon.png"><img src="../dandori-icon.png"><img src="../dustler-icon.png">
 <img src="../doughlab-icon.png"><img src="../sogak-icon.png"><img src="../bagshot-icon.png">
 <img src="../ipsomun-icon.png"><img src="../amen-icon.png"><img src="../juk-forest-icon.png">
</div></body></html>
