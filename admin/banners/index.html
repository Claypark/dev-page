<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <title>배너 Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0e1117;
      --bg-card: #161b22;
      --bg-input: #0d1117;
      --bg-raised: #1c2129;
      --bg-hover: #222831;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-bright: #f0f6fc;
      --accent: #238636;
      --accent-hover: #2ea043;
      --danger: #f85149;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    #loading-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; color: var(--text-muted); font-size: 14px;
    }

    #app { display: none; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; background: var(--bg-card);
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .back-link { color: var(--text-muted); text-decoration: none; font-size: 13px; }
    .back-link:hover { color: var(--text); }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--text-bright); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .user-name { font-size: 13px; color: var(--text-muted); }

    .layout {
      max-width: 1180px; margin: 32px auto; padding: 0 20px;
      display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start;
    }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

    .panel { background: var(--bg-card); border-radius: var(--radius); padding: 20px; }
    .panel + .panel { margin-top: 20px; }
    .panel-title { font-size: 15px; font-weight: 700; color: var(--text-bright); margin-bottom: 4px; }
    .panel-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }

    .pl-list { display: grid; gap: 6px; }
    .pl-item {
      display: block; width: 100%; text-align: left; background: var(--bg-raised);
      border: none; border-radius: 8px; padding: 10px 12px; cursor: pointer;
      color: var(--text); font-family: inherit;
    }
    .pl-item:hover { background: var(--bg-hover); }
    .pl-item.selected { background: #1f3a2a; }
    .pl-id { font-size: 13px; font-weight: 600; color: var(--text-bright); word-break: break-all; }
    .pl-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .grid-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.wide { grid-column: 1 / -1; }
    .field label, .field .label { font-size: 12px; color: var(--text-muted); }
    .input, select.input, textarea.input {
      width: 100%; background: var(--bg-input); border: none; border-radius: 8px;
      color: var(--text-bright); font-size: 14px; font-family: inherit; padding: 9px 12px;
    }
    .input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
    textarea.input { resize: vertical; min-height: 60px; }
    .check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
    .check input { width: 18px; height: 18px; accent-color: var(--accent); }

    .actions { display: flex; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
    .btn {
      background: var(--bg-raised); color: var(--text); border: none; border-radius: 8px;
      padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .btn:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-bright); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.primary { background: var(--accent); color: #fff; font-weight: 600; }
    .btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn.danger { color: var(--danger); }
    .btn.small { padding: 5px 10px; font-size: 12px; }

    .status { font-size: 13px; color: var(--text-muted); }
    .status.success { color: #3fb950; }
    .status.error { color: var(--danger); }

    .bn-list { display: grid; gap: 8px; }
    .bn-row {
      display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; align-items: center;
      background: var(--bg-raised); border-radius: 10px; padding: 10px;
    }
    .bn-row.editing { background: #1f3a2a; }
    .bn-row.off .bn-thumb, .bn-row.off .bn-main { opacity: 0.5; }
    .bn-thumb { width: 96px; height: 48px; border-radius: 6px; background: var(--bg-input) center / cover no-repeat; }
    .bn-title { font-size: 14px; color: var(--text-bright); font-weight: 600; }
    .bn-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .bn-stats { font-size: 12px; color: var(--text); margin-top: 3px; }
    .bn-ctrl { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    @media (max-width: 600px) { .bn-row { grid-template-columns: 72px 1fr; } .bn-ctrl { grid-column: 1 / -1; justify-content: flex-start; } }

    .attach-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .attach-row select { flex: 1; min-width: 200px; }

    .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .img-card { background: var(--bg-raised); border-radius: 10px; padding: 8px; display: grid; gap: 6px; }
    .img-card.active { background: #1f3a2a; }
    .img-card img { width: 100%; aspect-ratio: 2; object-fit: cover; border-radius: 6px; background: var(--bg-input); }
    .img-meta { font-size: 11px; color: var(--text-muted); }

    .preview {
      position: relative; width: 100%; max-width: 420px; border-radius: 12px; overflow: hidden;
      background: var(--bg-input) center / cover no-repeat;
    }
    .preview .shade { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 12px 16px; gap: 2px; }
    .preview.strip .shade { background: linear-gradient(90deg, rgba(0,0,0,0.6), rgba(0,0,0,0) 70%); max-width: 100%; }
    .preview.card .shade { justify-content: flex-end; background: linear-gradient(0deg, rgba(0,0,0,0.65), rgba(0,0,0,0) 60%); }
    .preview .pv-title { color: #fff; font-size: 15px; font-weight: 700; }
    .preview .pv-desc { color: rgba(255,255,255,0.85); font-size: 12px; }
    .preview-empty { font-size: 12px; color: var(--text-muted); padding: 14px; text-align: center; }
    .preview-note { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

    .muted { font-size: 13px; color: var(--text-muted); }
    .sub-title { font-size: 13px; font-weight: 600; color: var(--text-bright); margin: 22px 0 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="loading-screen">로딩 중...</div>

  <div id="app">
    <div class="topbar">
      <div class="topbar-left">
        <a href="../" class="back-link">← Admin</a>
        <span class="topbar-title">🪧 배너 관리</span>
      </div>
      <div class="topbar-right">
        <span class="user-name" id="user-display"></span>
        <button class="btn small" id="logoutBtn">로그아웃</button>
      </div>
    </div>

    <div class="layout">
      <div class="panel">
        <div class="panel-title">배너 자리</div>
        <div class="panel-desc">앱 화면마다 하나씩 있는 배너 칸입니다. 자리를 고르면 설정과 배너가 나옵니다.</div>
        <div class="pl-list" id="pl-list"><div class="muted">불러오는 중...</div></div>
      </div>

      <div>
        <div class="panel" id="pl-empty"><div class="muted">왼쪽에서 자리를 고르세요.</div></div>

        <!-- 자리 설정 -->
        <div class="panel hidden" id="pl-panel">
          <div class="panel-title" id="pl-title"></div>
          <div class="panel-desc" id="pl-desc"></div>
          <div class="grid-form">
            <div class="field">
              <label for="pl-shape">모양</label>
              <select id="pl-shape" class="input"><option value="strip">strip (가로 띠)</option><option value="card">card (카드)</option></select>
            </div>
            <div class="field">
              <label for="pl-ratio">가로세로 비율 (폭 ÷ 높이)</label>
              <input id="pl-ratio" class="input" type="number" step="0.1" min="0.1">
            </div>
            <div class="field">
              <label for="pl-transition">넘김 효과</label>
              <select id="pl-transition" class="input"><option value="slide">slide (밀기)</option><option value="fade">fade (교차)</option><option value="none">none (없음)</option></select>
            </div>
            <div class="field">
              <label for="pl-interval">넘김 간격 (초, 1~30)</label>
              <input id="pl-interval" class="input" type="number" step="0.5" min="1" max="30">
            </div>
            <div class="field">
              <label for="pl-fill">채우는 법</label>
              <select id="pl-fill" class="input"><option value="manual">manual (순서대로)</option><option value="auto">auto (태그 맞춤 우선)</option></select>
            </div>
            <div class="field">
              <label for="pl-max">최대 장수 (1~10)</label>
              <input id="pl-max" class="input" type="number" step="1" min="1" max="10">
            </div>
            <div class="field"><span class="label">닫기</span><label class="check"><input type="checkbox" id="pl-dismissible">닫기 버튼 보이기</label></div>
            <div class="field"><span class="label">상태</span><label class="check"><input type="checkbox" id="pl-active">자리 켜기</label></div>
          </div>
          <div class="actions">
            <button class="btn primary" id="pl-save">자리 설정 저장</button>
            <span class="status" id="pl-status"></span>
          </div>
        </div>

        <!-- 자리의 배너 -->
        <div class="panel hidden" id="slot-panel">
          <div class="panel-title">이 자리의 배너</div>
          <div class="panel-desc">위에서부터 순서대로 넘어갑니다. 숫자는 최근 30일 노출·클릭·닫기 수입니다.</div>
          <div class="bn-list" id="bn-list"></div>
          <div class="attach-row">
            <select id="attach-select" class="input"></select>
            <button class="btn" id="attach-btn">이 자리에 붙이기</button>
            <button class="btn" id="new-banner-btn">새 배너 만들기</button>
          </div>
          <div class="status" id="slot-status" style="margin-top:10px"></div>
        </div>

        <!-- 배너 편집 -->
        <div class="panel hidden" id="bn-panel">
          <div class="panel-title" id="bn-panel-title">배너 편집</div>
          <div class="panel-desc" id="bn-panel-desc"></div>
          <div class="grid-form">
            <div class="field">
              <label for="bn-kind">종류</label>
              <select id="bn-kind" class="input"><option value="app">app (우리 앱 홍보)</option><option value="web">web (웹 링크)</option><option value="affiliate">affiliate (제휴 쇼핑)</option></select>
            </div>
            <div class="field">
              <label for="bn-affiliate">제휴처</label>
              <select id="bn-affiliate" class="input"><option value="">없음</option><option value="coupang">coupang</option><option value="amazon">amazon</option></select>
            </div>
            <div class="field">
              <label for="bn-promoted">홍보 대상 앱 slug</label>
              <input id="bn-promoted" class="input" placeholder="kind=app일 때">
            </div>
            <div class="field wide">
              <label for="bn-url">이동 주소 (필수, 제휴 링크는 완성된 주소)</label>
              <input id="bn-url" class="input" type="url">
            </div>
            <div class="field wide">
              <label for="bn-url-android">Android 이동 주소 (비우면 기본 주소)</label>
              <input id="bn-url-android" class="input" type="url">
            </div>
            <div class="field wide">
              <label for="bn-url-ios">iOS 이동 주소 (비우면 기본 주소)</label>
              <input id="bn-url-ios" class="input" type="url">
            </div>
            <div class="field wide">
              <label for="bn-title">제목 (비우면 그림만)</label>
              <input id="bn-title" class="input">
            </div>
            <div class="field wide">
              <label for="bn-description">설명</label>
              <textarea id="bn-description" class="input"></textarea>
            </div>
            <div class="field wide">
              <label for="bn-alt">화면 읽기 문구 (필수)</label>
              <input id="bn-alt" class="input">
            </div>
            <div class="field">
              <label for="bn-tags">태그 (쉼표로 구분)</label>
              <input id="bn-tags" class="input" placeholder="clothes_care, sport:tennis">
            </div>
            <div class="field">
              <label for="bn-locales">언어 (쉼표로 구분)</label>
              <input id="bn-locales" class="input" placeholder="ko, en">
            </div>
            <div class="field">
              <span class="label">플랫폼</span>
              <label class="check"><input type="checkbox" id="bn-pf-android">android</label>
              <label class="check"><input type="checkbox" id="bn-pf-ios">ios</label>
            </div>
            <div class="field">
              <label for="bn-starts">시작 (운영자 현지 시각, 비우면 제한 없음)</label>
              <input id="bn-starts" class="input" type="datetime-local">
            </div>
            <div class="field">
              <label for="bn-ends">끝 (운영자 현지 시각, 비우면 제한 없음)</label>
              <input id="bn-ends" class="input" type="datetime-local">
            </div>
            <div class="field"><span class="label">상태</span><label class="check"><input type="checkbox" id="bn-active">배너 켜기</label></div>
          </div>
          <div class="actions">
            <button class="btn primary" id="bn-save">배너 저장</button>
            <button class="btn" id="bn-close">닫기</button>
            <span class="status" id="bn-status"></span>
          </div>

          <div id="bn-extra">
            <div class="sub-title">미리보기</div>
            <div id="preview-wrap"></div>

            <div class="sub-title">이미지 후보</div>
            <div class="img-grid" id="img-grid"></div>
            <div class="actions">
              <input type="file" id="img-file" accept="image/png" class="hidden">
              <button class="btn" id="img-upload-btn">PNG 이미지 올리기</button>
              <span class="status" id="img-status"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://nhroluokyjwdecsmpbwh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ocm9sdW9reWp3ZGVjc21wYndoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMDYyMTAsImV4cCI6MjA4ODY4MjIxMH0.aj200jMjwdK3bHLDBVL0b22AJhWd3rDl9XVcWkAbcYc';
const BUCKET = 'banner-images';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    detectSessionInUrl: true,
    autoRefreshToken: true,
    storageKey: 'admin-auth',
  },
});

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const orNull = (s) => { const t = (s ?? '').trim(); return t === '' ? null : t; };
const splitList = (s) => (s ?? '').split(',').map((t) => t.trim()).filter(Boolean);

function setStatus(id, msg, type) {
  const el = $(id);
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
  if (type === 'success') setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 3000);
}

// naru 어드민과 같은 규약: UTC ISO ↔ datetime-local(운영자 로컬)
function isoUtcToLocalInput(isoUtc) {
  if (!isoUtc) return '';
  const d = new Date(isoUtc);
  if (isNaN(d.getTime())) return '';
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function localInputToIsoUtc(localValue) {
  if (!localValue) return null;
  const d = new Date(localValue);
  return isNaN(d.getTime()) ? null : d.toISOString();
}

// ─── State ─────────────────────────────────────
let placements = [];
let currentPl = null;     // 선택한 자리 행
let slotRows = [];        // [{ banner_id, sort_order, banner, image }]
let allBanners = [];
let editingId = null;     // 편집 중 배너 id (null이면 새 배너)
let editingImages = [];

// ─── 자리 목록 ─────────────────────────────────
async function loadPlacements() {
  const { data, error } = await supabase.from('common_banner_placements').select('*').order('id');
  if (error) { $('pl-list').innerHTML = `<div class="status error">${esc(error.message)}</div>`; return; }
  placements = data;
  renderPlacements();
}

function renderPlacements() {
  if (!placements.length) { $('pl-list').innerHTML = '<div class="muted">등록된 자리가 없습니다.</div>'; return; }
  $('pl-list').innerHTML = placements.map((p) => `
    <button class="pl-item${currentPl?.id === p.id ? ' selected' : ''}" data-id="${esc(p.id)}">
      <div class="pl-id">${esc(p.id)}</div>
      <div class="pl-meta">${esc(p.shape)} · ${esc(p.aspect_ratio)}:1 · ${esc(p.fill_mode)}${p.active ? '' : ' · 꺼짐'}</div>
    </button>`).join('');
}

$('pl-list').addEventListener('click', (e) => {
  const btn = e.target.closest('.pl-item');
  if (btn) selectPlacement(btn.dataset.id);
});

async function selectPlacement(id) {
  currentPl = placements.find((p) => p.id === id);
  if (!currentPl) return;
  renderPlacements();
  closeEditor();
  $('pl-empty').classList.add('hidden');
  $('pl-panel').classList.remove('hidden');
  $('slot-panel').classList.remove('hidden');
  $('pl-title').textContent = currentPl.id;
  $('pl-desc').textContent = `${currentPl.app_slug}${currentPl.description ? ' · ' + currentPl.description : ''}`;
  $('pl-shape').value = currentPl.shape;
  $('pl-ratio').value = currentPl.aspect_ratio;
  $('pl-transition').value = currentPl.transition;
  $('pl-interval').value = currentPl.interval_ms / 1000;
  $('pl-fill').value = currentPl.fill_mode;
  $('pl-max').value = currentPl.max_items;
  $('pl-dismissible').checked = currentPl.dismissible;
  $('pl-active').checked = currentPl.active;
  setStatus('pl-status', '');
  await loadSlots();
}

$('pl-save').addEventListener('click', async () => {
  const ratio = Number($('pl-ratio').value);
  const intervalMs = Math.round(Number($('pl-interval').value) * 1000);
  const maxItems = parseInt($('pl-max').value, 10);
  if (!(ratio > 0)) return setStatus('pl-status', '비율은 0보다 커야 합니다.', 'error');
  if (!(intervalMs >= 1000 && intervalMs <= 30000)) return setStatus('pl-status', '넘김 간격은 1~30초입니다.', 'error');
  if (!(maxItems >= 1 && maxItems <= 10)) return setStatus('pl-status', '최대 장수는 1~10입니다.', 'error');
  const patch = {
    shape: $('pl-shape').value,
    aspect_ratio: ratio,
    transition: $('pl-transition').value,
    interval_ms: intervalMs,
    fill_mode: $('pl-fill').value,
    max_items: maxItems,
    dismissible: $('pl-dismissible').checked,
    active: $('pl-active').checked,
  };
  $('pl-save').disabled = true;
  const { data, error } = await supabase.from('common_banner_placements').update(patch).eq('id', currentPl.id).select().single();
  $('pl-save').disabled = false;
  if (error) return setStatus('pl-status', '저장 실패: ' + error.message, 'error');
  Object.assign(currentPl, data);
  renderPlacements();
  renderPreview();
  setStatus('pl-status', '저장되었습니다.', 'success');
});

// ─── 자리의 배너 ───────────────────────────────
async function loadSlots() {
  const [slotsRes, bannersRes] = await Promise.all([
    supabase.from('common_banner_slots').select('banner_id, sort_order').eq('placement_id', currentPl.id).order('sort_order'),
    supabase.from('common_banners').select('*').order('created_at', { ascending: false }),
  ]);
  if (slotsRes.error || bannersRes.error) {
    return setStatus('slot-status', '불러오기 실패: ' + (slotsRes.error || bannersRes.error).message, 'error');
  }
  allBanners = bannersRes.data;
  const ids = slotsRes.data.map((s) => s.banner_id);
  let images = [];
  if (ids.length) {
    const { data } = await supabase.from('common_banner_images').select('banner_id, url').in('banner_id', ids).eq('is_active', true);
    images = data ?? [];
  }
  slotRows = slotsRes.data.map((s) => ({
    ...s,
    banner: allBanners.find((b) => b.id === s.banner_id),
    image: images.find((i) => i.banner_id === s.banner_id)?.url ?? null,
    stats: null,
  }));
  renderSlots();
  renderAttachSelect();
  loadStats();
}

// 최근 30일 배너별 이벤트 수. 행을 받지 않고 head count로 센다(행 1000개 상한 회피).
async function loadStats() {
  const since = new Date(Date.now() - 30 * 86400000).toISOString();
  const rows = slotRows;
  await Promise.all(rows.map(async (r) => {
    const counts = await Promise.all(['impression', 'click', 'dismiss'].map(async (ev) => {
      const { count, error } = await supabase.from('common_banner_events')
        .select('id', { count: 'exact', head: true })
        .eq('banner_id', r.banner_id).eq('event', ev).gte('created_at', since);
      return error ? null : count;
    }));
    r.stats = counts;
  }));
  if (rows === slotRows) renderSlots();
}

function bannerLabel(b) {
  return b ? (b.title || b.alt_text || b.id) : '(없는 배너)';
}

function renderSlots() {
  if (!slotRows.length) { $('bn-list').innerHTML = '<div class="muted">아직 붙은 배너가 없습니다.</div>'; return; }
  $('bn-list').innerHTML = slotRows.map((r, i) => {
    const b = r.banner;
    const s = r.stats;
    const statLine = s ? `노출 ${s[0] ?? '?'} · 클릭 ${s[1] ?? '?'} · 닫기 ${s[2] ?? '?'}` : '집계 중...';
    return `
      <div class="bn-row${b?.active ? '' : ' off'}${editingId === r.banner_id ? ' editing' : ''}" data-id="${esc(r.banner_id)}">
        <div class="bn-thumb" style="${r.image ? `background-image:url('${esc(r.image)}')` : ''}"></div>
        <div class="bn-main">
          <div class="bn-title">${esc(bannerLabel(b))}</div>
          <div class="bn-meta">${esc(b?.kind ?? '')}${b?.affiliate ? ' · ' + esc(b.affiliate) : ''}${b?.active ? '' : ' · 꺼짐'}${r.image ? '' : ' · 활성 이미지 없음'}</div>
          <div class="bn-stats">${statLine}</div>
        </div>
        <div class="bn-ctrl">
          <button class="btn small" data-act="up" ${i === 0 ? 'disabled' : ''} aria-label="위로">↑</button>
          <button class="btn small" data-act="down" ${i === slotRows.length - 1 ? 'disabled' : ''} aria-label="아래로">↓</button>
          <button class="btn small" data-act="toggle">${b?.active ? '끄기' : '켜기'}</button>
          <button class="btn small" data-act="edit">편집</button>
          <button class="btn small danger" data-act="remove">빼기</button>
        </div>
      </div>`;
  }).join('');
}

function renderAttachSelect() {
  const attached = new Set(slotRows.map((r) => r.banner_id));
  const rest = allBanners.filter((b) => !attached.has(b.id));
  $('attach-select').innerHTML = rest.length
    ? rest.map((b) => `<option value="${esc(b.id)}">${esc(bannerLabel(b))} · ${esc(b.kind)}${b.active ? '' : ' · 꺼짐'}</option>`).join('')
    : '<option value="">붙일 수 있는 배너가 없습니다</option>';
  $('attach-btn').disabled = !rest.length;
}

$('bn-list').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.closest('.bn-row').dataset.id;
  const idx = slotRows.findIndex((r) => r.banner_id === id);
  const act = btn.dataset.act;
  if (act === 'up' || act === 'down') return moveSlot(idx, act === 'up' ? -1 : 1);
  if (act === 'edit') return openEditor(id);
  if (act === 'toggle') {
    const b = slotRows[idx].banner;
    const { error } = await supabase.from('common_banners').update({ active: !b.active }).eq('id', id);
    if (error) return setStatus('slot-status', '바꾸기 실패: ' + error.message, 'error');
    b.active = !b.active;
    renderSlots();
    if (editingId === id) $('bn-active').checked = b.active;
    return;
  }
  if (act === 'remove') {
    if (!confirm('이 자리에서 배너를 뺄까요? 배너 자체는 지워지지 않습니다.')) return;
    const { error } = await supabase.from('common_banner_slots').delete().eq('placement_id', currentPl.id).eq('banner_id', id);
    if (error) return setStatus('slot-status', '빼기 실패: ' + error.message, 'error');
    if (editingId === id) closeEditor();
    await loadSlots();
  }
});

// 같은 sort_order 값이 섞여 있어도 순서가 확실히 바뀌도록 옮긴 뒤 0,10,20...으로 다시 매긴다.
async function moveSlot(idx, dir) {
  const j = idx + dir;
  if (j < 0 || j >= slotRows.length) return;
  [slotRows[idx], slotRows[j]] = [slotRows[j], slotRows[idx]];
  const changed = [];
  slotRows.forEach((r, i) => { if (r.sort_order !== i * 10) { r.sort_order = i * 10; changed.push(r); } });
  renderSlots();
  const results = await Promise.all(changed.map((r) => supabase.from('common_banner_slots')
    .update({ sort_order: r.sort_order }).eq('placement_id', currentPl.id).eq('banner_id', r.banner_id)));
  const failed = results.find((res) => res.error);
  if (failed) { setStatus('slot-status', '순서 저장 실패: ' + failed.error.message, 'error'); await loadSlots(); }
}

async function attachBanner(bannerId) {
  const nextOrder = slotRows.length ? Math.max(...slotRows.map((r) => r.sort_order)) + 10 : 0;
  const { error } = await supabase.from('common_banner_slots').insert({ placement_id: currentPl.id, banner_id: bannerId, sort_order: nextOrder });
  if (error) { setStatus('slot-status', '붙이기 실패: ' + error.message, 'error'); return false; }
  return true;
}

$('attach-btn').addEventListener('click', async () => {
  const id = $('attach-select').value;
  if (!id) return;
  if (await attachBanner(id)) { await loadSlots(); setStatus('slot-status', '붙였습니다.', 'success'); }
});

$('new-banner-btn').addEventListener('click', () => openEditor(null));

// ─── 배너 편집 ─────────────────────────────────
function fillEditor(b) {
  $('bn-kind').value = b?.kind ?? 'app';
  $('bn-affiliate').value = b?.affiliate ?? '';
  $('bn-promoted').value = b?.promoted_app_slug ?? '';
  $('bn-url').value = b?.target_url ?? '';
  $('bn-url-android').value = b?.target_url_android ?? '';
  $('bn-url-ios').value = b?.target_url_ios ?? '';
  $('bn-title').value = b?.title ?? '';
  $('bn-description').value = b?.description ?? '';
  $('bn-alt').value = b?.alt_text ?? '';
  $('bn-tags').value = (b?.tags ?? []).join(', ');
  $('bn-locales').value = (b?.locales ?? ['ko']).join(', ');
  const pf = b?.platforms ?? ['android', 'ios'];
  $('bn-pf-android').checked = pf.includes('android');
  $('bn-pf-ios').checked = pf.includes('ios');
  $('bn-starts').value = isoUtcToLocalInput(b?.starts_at);
  $('bn-ends').value = isoUtcToLocalInput(b?.ends_at);
  $('bn-active').checked = b?.active ?? true;
  syncAffiliateField();
}

function syncAffiliateField() {
  const isAff = $('bn-kind').value === 'affiliate';
  $('bn-affiliate').disabled = !isAff;
  if (!isAff) $('bn-affiliate').value = '';
}
$('bn-kind').addEventListener('change', syncAffiliateField);
['bn-title', 'bn-description'].forEach((id) => $(id).addEventListener('input', renderPreview));

async function openEditor(id) {
  editingId = id;
  const b = id ? allBanners.find((x) => x.id === id) : null;
  fillEditor(b);
  $('bn-panel').classList.remove('hidden');
  $('bn-panel-title').textContent = id ? '배너 편집' : '새 배너';
  $('bn-panel-desc').textContent = id ? `id ${id}` : `저장하면 ${currentPl.id} 자리 맨 뒤에 붙습니다. 이미지는 저장 뒤에 올릴 수 있습니다.`;
  $('bn-extra').classList.toggle('hidden', !id);
  setStatus('bn-status', '');
  setStatus('img-status', '');
  renderSlots();
  editingImages = [];
  if (id) await loadImages();
  renderPreview();
  $('bn-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeEditor() {
  editingId = null;
  editingImages = [];
  $('bn-panel').classList.add('hidden');
  renderSlots();
}
$('bn-close').addEventListener('click', closeEditor);

$('bn-save').addEventListener('click', async () => {
  const kind = $('bn-kind').value;
  const affiliate = kind === 'affiliate' ? orNull($('bn-affiliate').value) : null;
  const platforms = ['android', 'ios'].filter((p) => $(`bn-pf-${p}`).checked);
  const row = {
    kind,
    affiliate,
    promoted_app_slug: orNull($('bn-promoted').value),
    target_url: orNull($('bn-url').value),
    target_url_android: orNull($('bn-url-android').value),
    target_url_ios: orNull($('bn-url-ios').value),
    title: orNull($('bn-title').value),
    description: orNull($('bn-description').value),
    alt_text: orNull($('bn-alt').value),
    tags: splitList($('bn-tags').value),
    locales: splitList($('bn-locales').value),
    platforms,
    starts_at: localInputToIsoUtc($('bn-starts').value),
    ends_at: localInputToIsoUtc($('bn-ends').value),
    active: $('bn-active').checked,
  };
  if (!row.target_url) return setStatus('bn-status', '이동 주소를 입력하세요.', 'error');
  if (!row.alt_text) return setStatus('bn-status', '화면 읽기 문구를 입력하세요.', 'error');
  if (kind === 'affiliate' && !affiliate) return setStatus('bn-status', '제휴 배너는 제휴처를 골라야 합니다.', 'error');
  if (!row.locales.length) return setStatus('bn-status', '언어를 하나 이상 입력하세요.', 'error');
  if (!platforms.length) return setStatus('bn-status', '플랫폼을 하나 이상 고르세요.', 'error');
  if (row.starts_at && row.ends_at && row.starts_at >= row.ends_at) return setStatus('bn-status', '끝이 시작보다 뒤여야 합니다.', 'error');

  $('bn-save').disabled = true;
  let res;
  if (editingId) {
    res = await supabase.from('common_banners').update(row).eq('id', editingId).select().single();
  } else {
    res = await supabase.from('common_banners').insert(row).select().single();
  }
  $('bn-save').disabled = false;
  if (res.error) return setStatus('bn-status', '저장 실패: ' + res.error.message, 'error');

  if (!editingId) {
    if (!(await attachBanner(res.data.id))) return setStatus('bn-status', '배너는 만들었지만 자리에 붙이지 못했습니다.', 'error');
    await loadSlots();
    await openEditor(res.data.id);
    return setStatus('bn-status', '만들었습니다. 이제 이미지를 올리세요.', 'success');
  }
  await loadSlots();
  setStatus('bn-status', '저장되었습니다.', 'success');
});

// ─── 이미지 후보 ───────────────────────────────
async function loadImages() {
  const { data, error } = await supabase.from('common_banner_images').select('*').eq('banner_id', editingId).order('created_at', { ascending: false });
  if (error) return setStatus('img-status', '이미지 불러오기 실패: ' + error.message, 'error');
  editingImages = data;
  renderImages();
}

function renderImages() {
  $('img-grid').innerHTML = editingImages.length ? editingImages.map((img) => `
    <div class="img-card${img.is_active ? ' active' : ''}">
      <img src="${esc(img.url)}" alt="" loading="lazy">
      <div class="img-meta">${img.width && img.height ? `${img.width}×${img.height}` : '크기 모름'} · ${esc(new Date(img.created_at).toLocaleString('ko-KR'))}</div>
      ${img.is_active ? '<div class="img-meta" style="color:#3fb950">사용 중</div>' : `<button class="btn small" data-img="${esc(img.id)}">이 이미지 쓰기</button>`}
    </div>`).join('') : '<div class="muted">이미지가 없습니다. 활성 이미지가 없으면 앱에 나오지 않습니다.</div>';
}

// 배너당 활성 이미지 1장(부분 유니크 인덱스): 기존 활성을 먼저 끄고 고른 것을 켠다.
$('img-grid').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-img]');
  if (!btn) return;
  btn.disabled = true;
  const off = await supabase.from('common_banner_images').update({ is_active: false }).eq('banner_id', editingId).eq('is_active', true);
  const on = off.error ? off : await supabase.from('common_banner_images').update({ is_active: true }).eq('id', btn.dataset.img);
  if (on.error) { setStatus('img-status', '바꾸기 실패: ' + on.error.message, 'error'); }
  else setStatus('img-status', '활성 이미지를 바꿨습니다.', 'success');
  await loadImages();
  await loadSlots();
  renderPreview();
});

$('img-upload-btn').addEventListener('click', () => $('img-file').click());

$('img-file').addEventListener('change', async () => {
  const file = $('img-file').files[0];
  $('img-file').value = '';
  if (!file || !editingId) return;
  if (file.type !== 'image/png') return setStatus('img-status', 'PNG 파일만 올릴 수 있습니다.', 'error');
  setStatus('img-status', '올리는 중...');
  $('img-upload-btn').disabled = true;
  try {
    const size = await new Promise((resolve) => {
      const im = new Image();
      im.onload = () => { resolve({ width: im.naturalWidth, height: im.naturalHeight }); URL.revokeObjectURL(im.src); };
      im.onerror = () => resolve({ width: null, height: null });
      im.src = URL.createObjectURL(file);
    });
    const path = `${editingId}/${Date.now()}.png`;
    const up = await supabase.storage.from(BUCKET).upload(path, file, { contentType: 'image/png', upsert: false });
    if (up.error) throw up.error;
    const url = supabase.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    const ins = await supabase.from('common_banner_images').insert({ banner_id: editingId, url, ...size, is_active: false });
    if (ins.error) throw ins.error;
    setStatus('img-status', '올렸습니다. 쓰려면 이 이미지 쓰기를 누르세요.', 'success');
    await loadImages();
  } catch (err) {
    setStatus('img-status', '올리기 실패: ' + err.message, 'error');
  } finally {
    $('img-upload-btn').disabled = false;
  }
});

// ─── 미리보기: 자리 비율 + 활성 이미지 + 오버레이 문구 ─
function renderPreview() {
  if (!editingId || !currentPl) return;
  const active = editingImages.find((i) => i.is_active);
  if (!active) { $('preview-wrap').innerHTML = '<div class="preview-empty">활성 이미지가 없어 앱에 나오지 않습니다.</div>'; return; }
  const title = orNull($('bn-title').value);
  const desc = orNull($('bn-description').value);
  $('preview-wrap').innerHTML = `
    <div class="preview ${esc(currentPl.shape)}" style="aspect-ratio:${Number(currentPl.aspect_ratio)};background-image:url('${esc(active.url)}')">
      ${title ? `<div class="shade"><div class="pv-title">${esc(title)}</div>${desc ? `<div class="pv-desc">${esc(desc)}</div>` : ''}</div>` : ''}
    </div>
    <div class="preview-note">${esc(currentPl.id)} · ${esc(currentPl.shape)} · ${esc(currentPl.aspect_ratio)}:1 (저장 전 문구도 바로 반영됩니다)</div>`;
}

// ─── Auth (naru 어드민과 같은 흐름, 비로그인·비관리자는 메인으로) ─
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabase.auth.signOut();
});

function goMain() {
  window.location.href = '../';
}

async function onLogin(session) {
  const user = session.user;
  const username = user.user_metadata?.user_name || user.email;

  const { data: admin } = await supabase
    .from('admins')
    .select('id')
    .eq('github_username', username)
    .single();

  if (!admin) {
    await supabase.auth.signOut();
    goMain();
    return;
  }

  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-display').textContent = `@${username}`;

  await loadPlacements();
}

let authInitDone = false;
let loggedIn = false;

async function handleSession(session) {
  if (session) {
    if (loggedIn) return;
    loggedIn = true;
    try { await onLogin(session); }
    catch (e) { console.error('onLogin error:', e); goMain(); }
  } else {
    goMain();
  }
}

supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'INITIAL_SESSION') {
    authInitDone = true;
    setTimeout(() => handleSession(session), 0);
    return;
  }
  if (event === 'SIGNED_IN' && session) {
    setTimeout(() => handleSession(session), 0);
    return;
  }
  if (event === 'SIGNED_OUT') goMain();
});

setTimeout(async () => {
  if (authInitDone) return;
  authInitDone = true;
  try {
    const { data: { session } } = await supabase.auth.getSession();
    await handleSession(session);
  } catch (e) {
    console.error('Fallback init error:', e);
    goMain();
  }
}, 4000);
</script>
